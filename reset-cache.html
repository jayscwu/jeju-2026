<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重置快取</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        color: #16211d;
        background: #f7f8f4;
      }
      main {
        width: min(92vw, 420px);
        padding: 24px;
        border: 1px solid #dce4df;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 10px 26px rgba(26, 40, 35, 0.08);
      }
      h1 {
        margin: 0 0 10px;
      }
      p {
        margin: 0;
        color: #68756f;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>正在重置快取</h1>
      <p id="message">請稍候，完成後會自動回到新版 Web App。</p>
    </main>
    <script>
      async function resetCache() {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }

        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }

        document.querySelector("#message").textContent = "重置完成，正在載入新版。";
        window.setTimeout(() => {
          window.location.replace("./index.html?v=" + Date.now());
        }, 600);
      }

      resetCache().catch((error) => {
        document.querySelector("#message").textContent = "重置時發生錯誤，請按 Ctrl + F5 後再試一次。";
        console.error(error);
      });
    </script>
  </body>
</html>
