<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="濟州旅遊" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="濟州旅遊" />
    <title>2026 濟州島旅遊</title>
    <link rel="manifest" href="manifest.webmanifest?v=16" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=16" />
  </head>
  <body>
    <main id="app" class="app-shell" aria-live="polite">
      <section id="lockScreen" class="lock-screen">
        <div class="lock-panel">
          <figure class="login-towel">
            <img src="攻頂毛巾.png" alt="漢拏山登頂成功紀念毛巾" />
          </figure>
          <p class="eyebrow">Jeju 2026</p>
          <h1>濟州島旅遊</h1>
          <p class="lock-date">2026.08.08 - 08.16</p>

          <form id="passwordForm" class="password-form" autocomplete="off">
            <div id="passwordHint" class="form-message" role="status"></div>

            <label for="travelerInput">選擇您的名字</label>
            <input id="travelerInput" class="traveler-input" type="search" placeholder="輸入名字快速篩選" autocomplete="off" />
            <input id="selectedTraveler" type="hidden" />
            <div id="travelerGrid" class="traveler-grid" aria-label="團員名單">
              <button type="button" disabled>載入中...</button>
            </div>

            <label for="passwordInput" class="password-label">
              輸入通行密碼
              <span>出發日期的4位數字</span>
            </label>
            <div class="password-field">
              <input
                id="passwordInput"
                type="password"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="4"
                placeholder="••••"
                aria-describedby="passwordHint"
              />
              <button id="passwordToggle" class="password-toggle" type="button" aria-label="顯示密碼">👁️</button>
            </div>
            <button class="login-button" type="submit">登入</button>
          </form>
        </div>
      </section>

      <section id="mainApp" class="main-app" hidden>
        <header class="topbar">
          <div class="user-menu-wrap">
            <button id="userMenuButton" class="user-button" type="button" aria-expanded="false" aria-controls="userMenu">
              <span id="userAvatar" class="user-avatar" aria-hidden="true">團</span>
              <span class="user-meta">
                <strong id="currentUser">團員</strong>
                <small id="appVersion">v1.0.0</small>
              </span>
            </button>
            <div id="userMenu" class="user-menu" hidden>
              <p>目前登入者</p>
              <strong id="menuCurrentUser">團員</strong>
              <button id="logoutButton" class="menu-logout" type="button">登出</button>
            </div>
          </div>
          <div class="title-area">
            <div class="page-title-row">
              <h1 id="pageTitle">公告</h1>
              <span id="pageCountBadge" class="top-count-badge" hidden>0筆</span>
            </div>
            <p id="syncStatus" class="sync-status">點擊更新 · 尚未同步</p>
          </div>
          <div class="top-actions">
            <button id="refreshButton" class="icon-button" type="button" aria-label="重新整理資料" title="重新整理資料">
              <span aria-hidden="true">↻</span>
            </button>
          </div>
        </header>

        <section id="noticeView" class="view active-view" aria-label="公告"></section>
        <section id="itineraryView" class="view" aria-label="每日行程"></section>
        <section id="fleetView" class="view" aria-label="車隊"></section>
        <section id="notesView" class="view" aria-label="重要紀事"></section>

        <nav class="bottom-nav" aria-label="主要功能">
          <button class="nav-item active" type="button" data-view="noticeView" data-title="公告">
            <span aria-hidden="true">📢</span>
            <span>公告</span>
          </button>
          <button class="nav-item" type="button" data-view="itineraryView" data-title="每日行程">
            <span aria-hidden="true">📅</span>
            <span>行程</span>
          </button>
          <button class="nav-item" type="button" data-view="fleetView" data-title="車隊">
            <span aria-hidden="true">🚗</span>
            <span>車隊</span>
          </button>
          <button class="nav-item" type="button" data-view="notesView" data-title="重要紀事">
            <span aria-hidden="true">📝</span>
            <span>紀事</span>
          </button>
        </nav>
      </section>
    </main>
    <script src="app.js?v=16" defer></script>
  </body>
</html>
